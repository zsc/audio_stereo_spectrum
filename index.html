<!-- index.html -->
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>双声道频谱叠加（红/蓝）可视化</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg:#0b0d12; --card:#11161d; --muted:#a3b1c6; --text:#e8eef8; --accent:#4da3ff; --danger:#ff5d7a;
      --border:#263142;
    }
    * { box-sizing: border-box; }
    html, body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
    header { padding:18px 22px; border-bottom:1px solid var(--border); background:linear-gradient(180deg, #0d1117, #0b0d12); position:sticky; top:0; z-index:10;}
    header h1 { margin:0; font-size:18px; letter-spacing:.5px; }
    .wrap { max-width:1100px; margin:24px auto; padding:0 16px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px; }
    .row { display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; }
    .field { display:flex; flex-direction:column; gap:6px; min-width:160px; }
    label { color:var(--muted); font-size:13px; }
    input[type="number"], select, input[type="text"] {
      background:#0c1219; color:var(--text); border:1px solid var(--border);
      border-radius:10px; padding:10px 12px; outline:none;
    }
    input[type="range"] { width:220px; }
    .btn {
      background:var(--accent); color:#09111a; border:none; padding:10px 16px; border-radius:12px; cursor:pointer; font-weight:600;
      transition:transform .04s ease, filter .15s ease;
    }
    .btn:active { transform:translateY(1px); }
    .btn.secondary { background:#1b2635; color:var(--text); }
    .btn.danger { background:var(--danger); color:#220309; }
    .hint { color:var(--muted); font-size:13px; }
    .sp { height:1px; background:var(--border); margin:16px 0; }
    .preview { width:100%; background:#0a0f16; border:1px dashed #29405c; border-radius:16px; display:flex; align-items:center; justify-content:center; min-height:220px; overflow:auto; }
    .preview img { max-width:100%; height:auto; display:block; }
    .meta { font-size:13px; color:var(--muted); }
    .footer { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .pill { font-size:12px; padding:5px 8px; border:1px solid var(--border); border-radius:999px; background:#0c1219; color:#c7d7ee; }
    .audio { margin-top:10px; }
    .error { color:var(--danger); }
  </style>
</head>
<body>
  <header><h1>双声道频谱叠加可视化（L=红 / R=蓝）</h1></header>

  <div class="wrap">
    <div class="card">
      <div class="row" style="align-items:flex-start">
        <div class="field" style="min-width:260px">
          <label>选择音频（.wav / .mp3）</label>
          <input id="file" type="file" accept=".wav,.mp3,audio/wav,audio/x-wav,audio/mpeg,audio/mp3"/>
          <div class="hint">最大 {{MAX}} MB。mp3 解码建议安装 FFmpeg。</div>
        </div>

        <div class="field">
          <label>FFT 大小 (n_fft)</label>
          <select id="nfft">
            <option>1024</option>
            <option selected>2048</option>
            <option>4096</option>
            <option>8192</option>
          </select>
        </div>

        <div class="field">
          <label>Hop 长度 (样本)</label>
          <input id="hop" type="number" value="512" min="1" step="1" />
          <div class="hint">建议约为 n_fft/4</div>
        </div>

        <div class="field">
          <label>叠加透明度 (α)</label>
          <input id="alpha" type="range" min="0.2" max="0.9" step="0.01" value="0.55"/>
        </div>

        <div class="field">
          <label>动态范围 (dB)</label>
          <input id="dyn" type="range" min="40" max="120" step="1" value="80"/>
        </div>

        <div class="field" style="min-width:140px">
          <label>&nbsp;</label>
          <button id="run" class="btn">生成频谱</button>
        </div>

        <div class="field" style="min-width:120px">
          <label>&nbsp;</label>
          <button id="reset" class="btn secondary">清空</button>
        </div>
      </div>

      <div class="sp"></div>

      <div class="preview" id="preview">
        <div class="hint">上传音频后点击“生成频谱”。双声道将以 红/蓝 叠加展示。</div>
      </div>

      <div class="footer" style="margin-top:12px">
        <a id="download" class="btn secondary" style="display:none" download="stereo_spectrogram_overlay.png">下载 PNG</a>
        <span id="status" class="pill">状态：待上传</span>
        <span id="meta" class="meta"></span>
      </div>

      <audio id="player" class="audio" controls style="width:100%; display:none"></audio>
      <div id="err" class="error"></div>
    </div>
  </div>

  <script>
    const MAX_MB = {{MAX_PLACEHOLDER}};
    document.body.innerHTML = document.body.innerHTML
      .replace("{{MAX}}", MAX_MB)
      .replace("{{MAX_PLACEHOLDER}}", MAX_MB);

    const fileEl = document.getElementById("file");
    const nfftEl = document.getElementById("nfft");
    const hopEl = document.getElementById("hop");
    const alphaEl = document.getElementById("alpha");
    const dynEl = document.getElementById("dyn");
    const runBtn = document.getElementById("run");
    const resetBtn = document.getElementById("reset");
    const preview = document.getElementById("preview");
    const metaEl = document.getElementById("meta");
    const statusEl = document.getElementById("status");
    const dl = document.getElementById("download");
    const errEl = document.getElementById("err");
    const player = document.getElementById("player");

    // 根据 n_fft 自动给 hop 一个大致默认值
    function syncHopDefault() {
      const n = parseInt(nfftEl.value || "2048", 10);
      const suggested = Math.max(1, Math.floor(n / 4));
      if (!hopEl.dataset.userChanged) {
        hopEl.value = suggested;
      }
    }
    nfftEl.addEventListener("change", syncHopDefault);
    hopEl.addEventListener("input", () => hopEl.dataset.userChanged = "1");
    syncHopDefault();

    function setBusy(b) {
      runBtn.disabled = b;
      resetBtn.disabled = b;
      statusEl.textContent = b ? "状态：处理中…" : "状态：空闲";
    }

    resetBtn.addEventListener("click", () => {
      fileEl.value = "";
      preview.innerHTML = '<div class="hint">上传音频后点击“生成频谱”。双声道将以 红/蓝 叠加展示。</div>';
      dl.style.display = "none";
      metaEl.textContent = "";
      errEl.textContent = "";
      player.src = "";
      player.style.display = "none";
      statusEl.textContent = "状态：已清空";
    });

    runBtn.addEventListener("click", async () => {
      errEl.textContent = "";
      const f = fileEl.files && fileEl.files[0];
      if (!f) {
        alert("请先选择音频文件（wav/mp3）");
        return;
      }
      if (f.size > MAX_MB * 1024 * 1024) {
        alert(`文件过大：限制 ${MAX_MB} MB`);
        return;
      }
      const fd = new FormData();
      fd.append("file", f);
      fd.append("n_fft", nfftEl.value);
      fd.append("hop_length", hopEl.value);
      fd.append("alpha", alphaEl.value);
      fd.append("dyn_range_db", dynEl.value);

      setBusy(true);
      statusEl.textContent = "状态：上传并分析中…";
      try {
        const resp = await fetch("/analyze", { method: "POST", body: fd });
        const data = await resp.json();

        if (!resp.ok || !data.ok) {
          const msg = data && data.message ? data.message : "处理失败";
          // 单声道则警告并停止
          alert(msg);
          errEl.textContent = msg;
          setBusy(false);
          return;
        }

        // 展示图像 + 下载
        const img = new Image();
        img.src = data.image_data_url;
        img.alt = "Stereo Spectrogram Overlay";
        img.onload = () => {
          preview.innerHTML = "";
          preview.appendChild(img);
        };
        dl.href = data.image_data_url;
        dl.style.display = "inline-block";

        // 展示 meta
        const m = data.meta || {};
        metaEl.textContent = `sr=${m.sample_rate} Hz | 时长≈${m.duration_sec}s | n_fft=${m.n_fft}, hop=${m.hop_length}, α=${m.alpha}, 动态范围=${m.dyn_range_db} dB`;

        // 本地播放原音频
        const objUrl = URL.createObjectURL(f);
        player.src = objUrl;
        player.style.display = "block";

        statusEl.textContent = "状态：完成";
      } catch (e) {
        console.error(e);
        errEl.textContent = "网络或服务器错误。";
        alert("网络或服务器错误。");
      } finally {
        setBusy(false);
      }
    });
  </script>
</body>
</html>
